<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AI Prompt Generátor - Lajos AI</title>
<style>
    :root {
        --bg: #0f172a;
        --card: #1e293b;
        --accent: #d4af37;
        --accent-dark: #b8962e;
        --text: #e2e8f0;
        --text-light: #94a3b8;
        --input: #334155;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        padding: 20px;
        line-height: 1.5;
    }

    .container {
        max-width: 1100px;
        margin: 0 auto;
    }

    h1 {
        text-align: center;
        color: var(--accent);
        margin-bottom: 0.4em;
        font-size: 2.4rem;
        letter-spacing: -0.02em;
    }

    .subtitle {
        text-align: center;
        color: var(--text-light);
        margin-bottom: 2.5rem;
        font-size: 1.1rem;
    }

    .card {
        background: var(--card);
        border-radius: 16px;
        padding: 2rem;
        margin-bottom: 2rem;
        box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    .form-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 1.8rem;
    }

    .field-group {
        display: flex;
        flex-direction: column;
        gap: 0.6rem;
    }

    label {
        color: var(--text-light);
        font-size: 0.95rem;
        font-weight: 500;
    }

    input[type="text"],
    input[type="number"],
    textarea,
    select {
        background: var(--input);
        border: 1px solid #475569;
        border-radius: 8px;
        padding: 12px 14px;
        color: var(--text);
        font-size: 1rem;
        transition: all 0.15s ease;
    }

    input:focus,
    textarea:focus,
    select:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(212,175,55,0.2);
    }

    textarea {
        min-height: 110px;
        resize: vertical;
    }

    .full-width {
        grid-column: 1 / -1;
    }

    .buttons {
        display: flex;
        gap: 1rem;
        flex-wrap: wrap;
        margin-top: 1.5rem;
    }

    button {
        padding: 14px 24px;
        border: none;
        border-radius: 10px;
        font-size: 1.05rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
    }

    .btn-primary {
        background: var(--accent);
        color: #0f172a;
    }

    .btn-primary:hover {
        background: var(--accent-dark);
        transform: translateY(-1px);
    }

    .btn-secondary {
        background: #475569;
        color: var(--text);
    }

    .btn-secondary:hover {
        background: #64748b;
    }

    #output-container {
        margin-top: 2.5rem;
    }

    #prompt-output {
        background: #020617;
        border: 1px solid #334155;
        border-radius: 12px;
        padding: 1.5rem;
        white-space: pre-wrap;
        min-height: 180px;
        font-family: 'Courier New', Courier, monospace;
        font-size: 1.05rem;
        line-height: 1.45;
        color: #e2e8f0;
        position: relative;
    }

    .copy-btn {
        position: absolute;
        top: 12px;
        right: 12px;
        background: #334155;
        color: white;
        border: none;
        padding: 8px 14px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 0.9rem;
    }

    .copy-btn:hover {
        background: #475569;
    }
</style>
</head>
<body>

<div class="container">
    <h1>AI Prompt Generátor</h1>
    <p class="subtitle">Részletes, magyar nyelvű kép- és videóprompt készítő</p>

    <div class="card">
        <div class="form-grid">

            <div class="field-group">
                <label for="tema">Fő téma / koncepció</label>
                <input type="text" id="tema" placeholder="pl. magyar népmesék világa, Balaton naplemente, cyberpunk Budapest">
            </div>

            <div class="field-group">
                <label for="stilus">Vizuális stílus</label>
                <select id="stilus">
                    <option value="">-- válassz stílust --</option>
                    <option value="rendkívül részletes, filmszerű, művészi realizmus">filmszerű realizmus</option>
                    <option value="festői, olajfestmény jelleg, impresszionista">olajfestmény / impresszionista</option>
                    <option value="cinematikus, 8K, ultra részletes, fotorealisztikus">cinematikus fotorealisztikus</option>
                    <option value="cyberpunk, neon, high-tech, sötét hangulat">cyberpunk neon</option>
                    <option value="studio ghibli stílus, anime, lágy pasztell">studio ghibli / anime</option>
                    <option value="surrealista, dali stílus, álomszerű">surreal / álomszerű</option>
                    <option value="magyar népművészet, kalocsai, matyó hímzés motívumok">magyar népművészet</option>
                </select>
            </div>

            <div class="field-group">
                <label for="szinpaletta">Színpaletta</label>
                <input type="text" id="szinpaletta" placeholder="pl. meleg arany, bordó, türkiz, földtónusok">
            </div>

            <div class="field-group">
                <label for="hangulat">Hangulat / érzelem</label>
                <input type="text" id="hangulat" placeholder="pl. melankolikus, monumentális, misztikus, nosztalgikus">
            </div>

            <div class="field-group full-width">
                <label for="kulcs_elemek">Megjelenítendő fontos elemek (vesszővel elválasztva)</label>
                <textarea id="kulcs_elemek" rows="3" placeholder="pl. Duna-part, Halászbástya, matyó ruhás nő, táltos ló, napraforgómező, lángoló naplemente"></textarea>
            </div>

            <div class="field-group">
                <label for="felirat">Felirat a képen (ha legyen)</label>
                <input type="text" id="felirat" placeholder="pl. Lajos AI - Örökségünk fénye">
            </div>

            <div class="field-group">
                <label for="felbontas">Felbontás / Aspect ratio</label>
                <select id="felbontas">
                    <option value="--ar 4:7 --stylize 750 --q 2 --v 6">4:7 (függőleges, közösségi média)</option>
                    <option value="--ar 16:9 --stylize 400 --v 6">16:9 (vízszintes, banner, youtube)</option>
                    <option value="--ar 1:1 --stylize 600">1:1 (négyzet, instagram poszt)</option>
                    <option value="--ar 3:4">3:4 (klasszikus portré)</option>
                    <option value="">nincs megadva</option>
                </select>
            </div>

        </div>

        <div class="buttons">
            <button class="btn-primary" onclick="generalPrompt()">Prompt generálása</button>
            <button class="btn-secondary" onclick="torolMezo()">Űrlap törlése</button>
        </div>
    </div>

    <div id="output-container" class="card" style="display:none;">
        <h3 style="margin-bottom:1rem; color:var(--accent)">Kész prompt:</h3>
        <div style="position:relative;">
            <pre id="prompt-output"></pre>
            <button class="copy-btn" onclick="copyToClipboard()">Másolás</button>
        </div>
    </div>

</div>

<script>
function generalPrompt() {
    const tema = document.getElementById('tema').value.trim();
    if (!tema) {
        alert('Kérlek, add meg a fő témát!');
        return;
    }

    const stilus = document.getElementById('stilus').value;
    const szinpaletta = document.getElementById('szinpaletta').value.trim();
    const hangulat = document.getElementById('hangulat').value.trim();
    const elemek = document.getElementById('kulcs_elemek').value.trim();
    const felirat = document.getElementById('felirat').value.trim();
    const felbontas = document.getElementById('felbontas').value;

    let prompt = `Rendkívül részletes, kifinomult, ${stilus || "művészi"} alkotás, ${hangulat || "időtlen, elegáns, mély hangulatú"} atmoszféra, `;

    if (szinpaletta) prompt += `${szinpaletta} színvilág, `;

    prompt += `középpontban: ${tema}\n\n`;

    if (elemek) {
        prompt += `Fontos vizuális elemek és motívumok: ${elemek.split(',').map(e=>e.trim()).filter(Boolean).join(', ')}\n\n`;
    }

    if (felirat) {
        prompt += `Nagyméretű, gyönyörű, elegáns díszes felirat középen felül: „${felirat}”, luxus arany vagy mély meleg barna szín, művészi kalligrafikus betűtípus\n`;
        prompt += `Finom költői magyar alcím alatta kisebb betűkkel\n\n`;
    }

    prompt += `Mesterien megkomponált kompozíció, tökéletes egyensúly, filmes megvilágítás, lágy bokeh, mély térérzet, textúrált felületek, `;
    prompt += `múzeumi minőség, 8K ultra részletes, hiperrealisztikus részletgazdagság, mesterséges intelligencia művészet\n`;

    if (felbontas) prompt += `\n${felbontas}`;

    const outputEl = document.getElementById('prompt-output');
    outputEl.textContent = prompt;

    document.getElementById('output-container').style.display = 'block';
    outputEl.scrollIntoView({behavior: 'smooth'});
}

function torolMezo() {
    document.querySelectorAll('input, textarea, select').forEach(el => {
        if (el.type !== 'button') el.value = '';
    });
    document.getElementById('output-container').style.display = 'none';
}

function copyToClipboard() {
    const text = document.getElementById('prompt-output').textContent;
    navigator.clipboard.writeText(text).then(() => {
        alert('Prompt kimásolva a vágólapra! 📋');
    }).catch(() => {
        alert('Sajnos nem sikerült a másolás...');
    });
}
</script>
</body>
</html>
