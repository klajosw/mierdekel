                    maintainAspectRatio: false,
                    plugins: { 
                        legend: { position: 'right', labels: { color: '#94a3b8', font: { size: 11 } } }
                    },
                    cutout: '70%'
                }
            });

            // Authority Chart
            const auths = {};
            rawData.forEach(d => auths[d.Authority] = (auths[d.Authority] || 0) + 1);
            const sortedAuths = Object.entries(auths).sort((a,b) => b[1] - a[1]).slice(0, 7);

            new Chart(document.getElementById('authorityChart'), {
                type: 'bar',
                data: {
                    labels: sortedAuths.map(x => x[0]),
                    datasets: [{
                        data: sortedAuths.map(x => x[1]),
                        backgroundColor: '#10b981',
                        borderRadius: 8,
                        barThickness: 20
                    }]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { grid: { color: '#1e293b' }, ticks: { color: '#64748b' } },
                        y: { grid: { display: false }, ticks: { color: '#f1f5f9', font: { weight: '600' } } }
                    }
                }
            });
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            const noResults = document.getElementById('noResults');
            
            let displayData = rawData.filter(item => {
                const matchesFilter = currentFilter === 'all' || item.Category === currentFilter;
                const searchTerm = document.getElementById('searchInput').value.toLowerCase();
                const matchesSearch = item.Name.toLowerCase().includes(searchTerm) || item.Authority.toLowerCase().includes(searchTerm);
                return matchesFilter && matchesSearch;
            });

            displayData.sort((a, b) => {
                let valA = a[sortCol];
                let valB = b[sortCol];
                if (sortAsc) return valA > valB ? 1 : -1;
                else return valA < valB ? 1 : -1;
            });

            if (displayData.length === 0) {
                tbody.innerHTML = '';
                noResults.classList.remove('hidden');
                return;
            }

            noResults.classList.add('hidden');
            tbody.innerHTML = displayData.map(item => `
                <tr class="transition-colors hover:bg-slate-800/30 group">
                    <td class="p-5">
                        <div class="font-bold text-slate-100 text-sm group-hover:text-blue-400 transition-colors">${item.Name}</div>
                    </td>
                    <td class="p-5">
                        <span class="category-badge border ${categoryColors[item.Category]}">${item.Category}</span>
                    </td>
                    <td class="p-5 text-slate-400 text-sm font-medium">${item.Authority}</td>
                    <td class="p-5 text-center text-slate-400 text-sm tabular-nums">${item.Year}</td>
                    <td class="p-5 text-center">
                        <a href="${item.Url}" target="_blank" class="w-8 h-8 inline-flex items-center justify-center rounded-lg bg-slate-800 border border-slate-700 text-slate-400 hover:text-white hover:border-blue-500 transition-all">
                            <i class="fas fa-external-link-alt text-xs"></i>
                        </a>
                    </td>
                </tr>
            `).join('');
        }

        // Search and Filter Listeners
        document.getElementById('searchInput').addEventListener('input', renderTable);

        document.querySelectorAll('.btn-filter').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                renderTable();
            });
        });

        // Sorting
        document.querySelectorAll('th.sortable').forEach(th => {
            th.addEventListener('click', () => {
                const col = th.dataset.sort;
                if (sortCol === col) sortAsc = !sortAsc;
                else { sortCol = col; sortAsc = true; }
                renderTable();
            });
        });

        window.onload = () => {
            initCharts();
            renderTable();
        };
    </script>
</body>
</html>
