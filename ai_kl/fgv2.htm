<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trigonometrikus függvények</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <script>
        let circleX = 200;
        let circleY = 150;
        let circleRadius = 75;

        let graphX = 50;
        let graphY = 300;
        let graphAmplitude = 50;
        let graphPeriod = 300;

        function setup() {
            createCanvas(400, 500);
            angleMode(DEGREES);
        }

        function draw() {
            background(0);
            let angle = frameCount % 360;

            fill(255);
            textSize(20);
            textAlign(LEFT, CENTER);
            text(`angle: ${angle}`, 25, 25);

            noFill();
            stroke(128);
            strokeWeight(3);
            circle(circleX, circleY, 2 * circleRadius);
            line(circleX, circleY - circleRadius, circleX, circleY + circleRadius);
            line(circleX - circleRadius, circleY, circleX + circleRadius, circleY);

            let pointX = circleX + circleRadius * cos(angle);
            let pointY = circleY - circleRadius * sin(angle);

            line(circleX, circleY, pointX, pointY);

            noStroke();
            fill('white');
            circle(pointX, pointY, 10);
            fill('orange');
            circle(pointX, circleY, 10);
            fill('red');
            circle(circleX, pointY, 10);

            stroke('grey');
            strokeWeight(3);
            line(graphX, graphY, graphX + 300, graphY);
            line(graphX, graphY - graphAmplitude, graphX, graphY + graphAmplitude);
            line(graphX + graphPeriod, graphY - graphAmplitude, graphX + graphPeriod, graphY + graphAmplitude);

            fill('grey');
            strokeWeight(1);
            textAlign(CENTER, CENTER);
            text('0', graphX, graphY + graphAmplitude + 20);
            text('360', graphX + graphPeriod, graphY + graphAmplitude + 20);
            text('1', graphX / 2, graphY - graphAmplitude);
            text('0', graphX / 2, graphY);
            text('-1', graphX / 2, graphY + graphAmplitude);

            fill('orange');
            text('cos', graphX + graphPeriod + graphX / 2, graphY - graphAmplitude);
            fill('red');
            text('sin', graphX + graphPeriod + graphX / 2, graphY);
            fill('blue');
            text('tan', graphX + graphPeriod + graphX / 2, graphY + graphAmplitude + 40);
            fill('green');
            text('cot', graphX + graphPeriod + graphX / 2, graphY + graphAmplitude + 60);

            noFill();
            stroke('orange');
            beginShape();
            for (let t = 0; t <= 360; t++) {
                let x = map(t, 0, 360, graphX, graphX + graphPeriod);
                let y = graphY - graphAmplitude * cos(t);
                vertex(x, y);
            }
            endShape();

            stroke('red');
            beginShape();
            for (let t = 0; t <= 360; t++) {
                let x = map(t, 0, 360, graphX, graphX + graphPeriod);
                let y = graphY - graphAmplitude * sin(t);
                vertex(x, y);
            }
            endShape();

            stroke('blue');
            beginShape();
            for (let t = 0; t <= 360; t++) {
                let tanValue = tan(t);
                if (abs(tanValue) < 10) {
                    let x = map(t, 0, 360, graphX, graphX + graphPeriod);
                    let y = graphY - (graphAmplitude / 2) * tanValue;
                    vertex(x, y);
                }
            }
            endShape();

            stroke('green');
            beginShape();
            for (let t = 1; t < 360; t++) {
                let cotValue = 1 / tan(t);
                if (abs(cotValue) < 10) {
                    let x = map(t, 0, 360, graphX, graphX + graphPeriod);
                    let y = graphY - (graphAmplitude / 2) * cotValue;
                    vertex(x, y);
                }
            }
            endShape();

            let lineX = map(angle, 0, 360, graphX, graphX + graphPeriod);
            stroke('grey');
            line(lineX, graphY - graphAmplitude, lineX, graphY + graphAmplitude);

            let orangeY = graphY - graphAmplitude * cos(angle);
            let redY = graphY - graphAmplitude * sin(angle);
            let blueY = graphY - (graphAmplitude / 2) * tan(angle);
            let greenY = graphY - (graphAmplitude / 2) * (1 / tan(angle));

            noStroke();
            fill('orange');
            circle(lineX, orangeY, 10);
            fill('red');
            circle(lineX, redY, 10);
            if (abs(tan(angle)) < 10) {
                fill('blue');
                circle(lineX, blueY, 10);
            }
            if (abs(1 / tan(angle)) < 10) {
                fill('green');
                circle(lineX, greenY, 10);
            }
        }
    </script>
</head>
<body>
</body>
</html>
