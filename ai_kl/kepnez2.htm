        *{font-family:ui-sans-system, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif; box-sizing:border-box}
        html,body{max-width:100vw; overflow-x:hidden; margin:0; padding:0}
        #root{max-width:100vw; overflow-x:hidden}
        .mono{font-family:ui-monospace, SFMono-Regular, Menlo, monospace}
        .app-root{
          min-height:100vh;
          max-width:100vw;
          width:100%;
          overflow-x:hidden;
          background: radial-gradient(1200px 800px at 20% -10%, rgba(var(--glow),0.18), transparent 60%),
                      radial-gradient(900px 600px at 90% 10%, rgba(var(--glow),0.12), transparent 70%),
                      var(--bg);
          color:var(--text);
          transition: background 0.6s, color 0.3s;
        }
        .app-root.light{
          --bg:#fbf7f2;
          --bg2:#ffffff;
          --card:#ffffffcc;
          --card2:#fff;
          --text:#1a1a1e;
          --text2:#6b6b76;
          --border:#ece8e3;
          --shadow:0 10px 30px rgba(0,0,0,0.07), 0 2px 8px rgba(0,0,0,0.04);
          --shadow-lg:0 20px 60px rgba(0,0,0,0.10);
        }
        .app-root.dark{
          --bg:#0d0c0e;
          --bg2:#161417;
          --card:#1c1a1ecc;
          --card2:#232126;
          --text:#f5f3f0;
          --text2:#9a9590;
          --border:#2a272a;
          --shadow:0 10px 30px rgba(0,0,0,0.4), 0 2px 8px rgba(0,0,0,0.3);
          --shadow-lg:0 24px 80px rgba(0,0,0,0.6);
        }
        .glass{
          background:var(--card);
          backdrop-filter: blur(24px) saturate(1.2);
          -webkit-backdrop-filter: blur(24px) saturate(1.2);
          border:1px solid var(--border);
          box-shadow:var(--shadow);
        }
        .card{
          border-radius:20px;
        }
        @keyframes float{
          0%,100%{transform:translateY(0)}
          50%{transform:translateY(-6px)}
        }
        @keyframes spinZ{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
        @keyframes axisX{0%,100%{transform:rotateX(0deg)}50%{transform:rotateX(20deg) rotateY(10deg)}}
        @keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
        @keyframes enterRight{from{transform:translateX(90%) scale(0.9); opacity:0} to{transform:translateX(0) scale(1); opacity:1}}
        @keyframes enterLeft{from{transform:translateX(-90%) scale(0.9); opacity:0} to{transform:translateX(0) scale(1); opacity:1}}
        @keyframes enterTop{from{transform:translateY(-90%) scale(0.9); opacity:0} to{transform:translateY(0) scale(1); opacity:1}}
        @keyframes enterBottom{from{transform:translateY(90%) scale(0.9); opacity:0} to{transform:translateY(0) scale(1); opacity:1}}
        @keyframes pageFlipIn{0%{transform:rotateY(-90deg) scale(0.9); opacity:0} 100%{transform:rotateY(0) scale(1); opacity:1}}
        .particles{position:fixed; inset:0; pointer-events:none; opacity:0.7; width:100%; height:100%; max-width:100vw; overflow:hidden}
        .stage{perspective:1400px; transform-style:preserve-3d; width:100%; max-width:100%; height:100%; display:flex; align-items:center; justify-content:center; overflow:hidden; border-radius:28px; contain:layout paint; isolation:isolate; box-sizing:border-box}
        .plane-item{position:absolute; width:min(68%, 520px); max-width:85%; aspect-ratio:4/3; border-radius:24px; overflow:hidden; box-shadow:var(--shadow-lg); transition:transform 0.8s cubic-bezier(.16,1,.3,1), opacity 0.6s; will-change:transform; max-inline-size:85%}
        .plane-item img{width:100%; height:100%; object-fit:cover}
        .cyl-item{position:absolute; width:min(320px, 70vw); height:220px; left:50%; top:50%; margin-left:min(-160px, -35vw); margin-top:-110px; border-radius:18px; overflow:hidden; box-shadow:var(--shadow-lg); backface-visibility:hidden; max-width:70vw}
        .cyl-item img{width:100%; height:100%; object-fit:cover}
        .sphere-item{position:absolute; width:min(180px, 40vw); height:130px; left:50%; top:50%; margin-left:min(-90px, -20vw); margin-top:-65px; border-radius:16px; overflow:hidden; box-shadow:var(--shadow); backface-visibility:hidden; max-width:40vw}
        .sphere-item img{width:100%; height:100%; object-fit:cover}
