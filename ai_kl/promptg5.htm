<!DOCTYPE html>

<head>

    <style>
        :root { --primary: #e50914; --bg: #141414; --card: #222; --text: #eee; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); color: var(--text); padding: 20px; margin: 0; }
        .container { max-width: 1000px; margin: auto; background: var(--card); padding: 30px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1 { text-align: center; color: var(--primary); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 30px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .form-group { background: #2c2c2c; padding: 15px; border-radius: 8px; border: 1px solid #444; }
        label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 8px; color: #aaa; text-transform: uppercase; }
        select, input { width: 100%; padding: 10px; background: #111; border: 1px solid #555; color: white; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
        .custom-input { margin-top: 10px; border-color: var(--primary); font-style: italic; }
        .full-width { grid-column: span 2; }
        #result-container { margin-top: 30px; background: #000; padding: 25px; border-radius: 8px; border: 2px solid var(--primary); }
        textarea { width: 100%; height: 120px; background: transparent; color: #00ff41; border: none; font-family: 'Courier New', monospace; font-size: 16px; resize: none; outline: none; line-height: 1.5; }
        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        button { flex: 1; padding: 15px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; text-transform: uppercase; transition: 0.3s; }
        .copy-btn { background: var(--primary); color: white; }
        .reset-btn { background: #444; color: white; }
        button:hover { opacity: 0.8; }
        @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } .full-width { grid-column: span 1; } }
    </style>
</head>

<script>
    let translatedSubject = "";
    let timeoutId = null;

    function handleSubjectInput() {
        const text = document.getElementById('subject').value.trim();
        const status = document.getElementById('translation-status');
        
        if (!text) {
            translatedSubject = "";
            build();
            return;
        }

        status.innerText = "Fordítás...";
        
        clearTimeout(timeoutId);
        timeoutId = setTimeout(() => {
            translate(text);
        }, 800);
    }

    async function translate(text) {
        const status = document.getElementById('translation-status');
        try {
            const response = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=hu|en`);
            const data = await response.json();
            translatedSubject = data.responseData.translatedText;
            status.innerText = "✓ Lefordítva";
            build();
        } catch (error) {
            status.innerText = "Hiba a fordításkor, de az eredeti bekerül.";
            translatedSubject = text; 
            build();
        }
    }

    function sync(id, val) {
        if(val !== undefined) {
            document.getElementById(id).value = val;
            build();
        }
    }

    function build() {
        const currentSubject = translatedSubject || document.getElementById('subject').value.trim();
        const formatParams = document.getElementById('sel-format').value;
        const otherIds = ['genre', 'era', 'camera', 'weather', 'lighting', 'lens', 'color'];
        let resultParts = [];
        
        if(currentSubject) resultParts.push(currentSubject);
        
        otherIds.forEach(id => {
            const val = document.getElementById(id).value.trim();
            if(val) resultParts.push(val);
        });

        if(resultParts.length > 0) {
            const finalString = resultParts.join(", ") + ", cinematic photography, photorealistic, 8k, highly detailed, masterwork " + formatParams;
            document.getElementById('final-prompt').value = finalString;
        } else {
            document.getElementById('final-prompt').value = "";
        }
    }

    function copy() {
        const area = document.getElementById('final-prompt');
        if(!area.value) return;
        area.select();
        navigator.clipboard.writeText(area.value);
        const btn = document.querySelector('.copy-btn');
        btn.innerText = "KIMÁSOLVA! ✓";
        btn.style.background = "#10b981";
        setTimeout(() => { btn.innerText = "PROMPT MÁSOLÁSA"; btn.style.background = ""; }, 2000);
    }

    function resetAll() {
        document.querySelectorAll('input').forEach(i => i.value = "");
        document.querySelectorAll('select').forEach(s => s.selectedIndex = (s.id === 'sel-format' ? 0 : 0));
        document.getElementById('final-prompt').value = "";
        document.getElementById('translation-status').innerText = "";
        translatedSubject = "";
        build();
    }
</script>

</body>
</html>
