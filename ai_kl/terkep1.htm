        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        *{box-sizing:border-box}
        html,body{margin:0;padding:0;height:100%;font-family:Inter,system-ui,sans-serif;overflow:hidden}
        .root{--bg:#f6f4ef;--panel:#ffffff;--border:#e7e5e4;--text:#1c1917;--muted:#78716c;--accent:#111;position:relative;width:100vw;height:100dvh;background:var(--bg);color:var(--text);overflow:hidden}
        .root.dark{--bg:#0c0a09;--panel:#1c1917;--border:#292524;--text:#f5f5f4;--muted:#a8a29e;--accent:#f5f5f4}
        #sidebar{position:absolute;left:0;top:0;bottom:0;width:360px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:1000;overflow:hidden;transition:transform .25s}
        #map{position:absolute;left:360px;right:0;top:0;bottom:0;background:#d6d3d1;z-index:0}
        .sidebar-header{padding:14px 14px 10px;border-bottom:1px solid var(--border)}
        .logo-row{display:flex;gap:10px;align-items:center}
        .logo{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:800}
        .title{font-weight:700;font-size:15px}
        .subtitle{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
        .stats{margin-top:10px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
        .stat{border:1px solid var(--border);border-radius:10px;padding:6px 8px;background:var(--bg)}
        .stat b{display:block;font-size:13px}
        .stat span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
        .search-wrap{position:relative;margin-top:10px}
        .search-wrap i{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-style:normal}
        .search-input{width:100%;height:42px;padding:0 34px 0 32px;border-radius:12px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:13px;outline:none}
        .search-input:focus{border-color:var(--text);box-shadow:0 0 0 3px rgba(0,0,0,.08)}
        .clear-btn{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:24px;height:24px;border-radius:50%;border:none;background:var(--accent);color:var(--bg);cursor:pointer}
        .search-meta{margin-top:6px;font-size:11px;color:var(--muted)}
        .section{padding:10px 12px;border-bottom:1px solid var(--border)}
        .section-title{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
        .cat-list{display:flex;flex-direction:column;gap:6px}
        .cat-item{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-radius:10px;border:1px solid var(--border);cursor:pointer;background:var(--bg);user-select:none}
        .cat-item.active{background:var(--accent);color:var(--bg);border-color:var(--accent)}
        .cat-left{display:flex;align-items:center;gap:8px}
        .cat-icon{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px}
        .cat-count{font-size:10px;padding:2px 7px;border-radius:99px;background:var(--panel);border:1px solid var(--border)}
        .cat-item.active .cat-count{background:rgba(255,255,255,.15);color:var(--bg);border-color:rgba(255,255,255,.2)}
        .root.dark .cat-item.active .cat-count{background:rgba(0,0,0,.2);color:var(--text)}
        .base-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
        .base-btn{height:32px;border-radius:999px;border:1px solid var(--border);background:var(--panel);font-size:11px;cursor:pointer;color:var(--text)}
        .base-btn.active{background:var(--accent);color:var(--bg);border-color:var(--accent)}
        .results{flex:1;position:relative;overflow:auto;background:var(--bg)}
        .vlist{position:relative;width:100%}
        .vrow{position:absolute;left:8px;right:8px;height:66px}
        .result-card{width:100%;height:66px;text-align:left;display:flex;gap:8px;padding:8px;border-radius:12px;border:1px solid var(--border);background:var(--panel);cursor:pointer}
        .result-card.selected{background:var(--accent);color:var(--bg);border-color:var(--accent)}
        .result-icon{width:30px;height:30px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px}
        .result-name{font-size:12px;font-weight:600;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
        .result-desc{font-size:10px;color:var(--muted);line-height:1.2;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
        .result-card.selected .result-desc{color:var(--bg);opacity:.8}
        .badge{font-size:9px;padding:1px 6px;border-radius:99px;background:var(--bg);border:1px solid var(--border);margin-top:4px;display:inline-block}
        .result-card.selected .badge{background:rgba(255,255,255,.15);color:var(--bg)}
        .footer{padding:8px;border-top:1px solid var(--border);background:var(--panel);display:flex;gap:6px;align-items:center}
        .btn{height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--border);background:var(--panel);font-size:12px;cursor:pointer;color:var(--text)}
        .btn-primary{background:var(--accent);color:var(--bg);border-color:var(--accent)}
        .progress{position:absolute;top:0;left:0;right:0;height:3px;background:transparent;z-index:500;pointer-events:none}
        .progress-bar{height:100%;background:linear-gradient(90deg,#2563eb,#7c3aed);transition:width .1s;width:0}
        .progress-text{position:absolute;top:6px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;font-size:11px;padding:4px 12px;border-radius:999px;z-index:501;pointer-events:none}
        .top-chips{position:absolute;top:44px;left:12px;right:80px;z-index:400;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
        .chip{background:rgba(255,255,255,.9);backdrop-filter:blur(8px);border:1px solid var(--border);padding:3px 9px;border-radius:999px;font-size:10px;font-weight:500;color:#1c1917}
        .root.dark .chip{background:rgba(28,25,23,.9);color:#f5f5f4}
        .map-info{position:absolute;bottom:12px;left:12px;z-index:400;background:rgba(255,255,255,.92);border:1px solid var(--border);padding:6px 12px;border-radius:999px;font-size:11px;font-weight:500;box-shadow:0 2px 8px rgba(0,0,0,.08);color:#1c1917;max-width:78vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .root.dark .map-info{background:rgba(28,25,23,.92);color:#f5f5f4}
        .mobile-toggle{display:none;position:absolute;top:12px;right:12px;z-index:1001;width:44px;height:44px;border-radius:12px;border:none;background:#111;color:#fff;font-size:18px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.2)}
        @media(max-width:900px){#sidebar{width:100%;transform:translateX(0)}#sidebar.hidden{transform:translateX(-100%)}#map{left:0;top:0}.mobile-toggle{display:flex;align-items:center;justify-content:center}}
        .leaflet-popup-content-wrapper{border-radius:14px !important}
