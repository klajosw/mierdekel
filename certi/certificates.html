<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tanúsítványok</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0e0f;
    --surface: #161618;
    --surface2: #1e1e21;
    --border: #2a2a2e;
    --border2: #38383d;
    --text: #f0ede8;
    --muted: #8a8790;
    --faint: #4a4850;
    --accent: #c8b87a;
    --accent2: #7a9cb8;
    --ai: #b8a0d4;
    --data: #7abfa8;
    --viz: #7ab8d4;
    --cloud: #a0c4d4;
    --cyber: #d47a7a;
    --dev: #c4b87a;
    --pm: #d4a07a;
    --other: #9a9a9a;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    font-size: 15px;
    line-height: 1.6;
    min-height: 100vh;
  }

  /* HEADER */
  header {
    border-bottom: 1px solid var(--border);
    padding: 3.5rem 4rem 2.5rem;
    position: relative;
    overflow: hidden;
  }
  header::before {
    content: '';
    position: absolute;
    top: -80px; left: -80px;
    width: 360px; height: 360px;
    background: radial-gradient(circle, rgba(200,184,122,0.07) 0%, transparent 70%);
    pointer-events: none;
  }
  header::after {
    content: '';
    position: absolute;
    bottom: -60px; right: 10%;
    width: 280px; height: 280px;
    background: radial-gradient(circle, rgba(122,156,184,0.06) 0%, transparent 70%);
    pointer-events: none;
  }
  .header-label {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.18em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 0.75rem;
  }
  h1 {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(2.2rem, 5vw, 3.8rem);
    font-weight: 400;
    line-height: 1.1;
    color: var(--text);
    margin-bottom: 0.5rem;
  }
  h1 em {
    font-style: italic;
    color: var(--accent);
  }
  .header-sub {
    color: var(--muted);
    font-size: 14px;
    margin-top: 1rem;
  }

  /* STATS */
  .stats-row {
    display: flex;
    gap: 2px;
    flex-wrap: wrap;
    padding: 1.5rem 4rem;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .stat-item {
    flex: 1;
    min-width: 100px;
    padding: 0.75rem 1.25rem;
    border-right: 1px solid var(--border);
  }
  .stat-item:last-child { border-right: none; }
  .stat-n {
    font-family: 'DM Serif Display', serif;
    font-size: 2rem;
    color: var(--accent);
    line-height: 1;
  }
  .stat-l {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.05em;
    margin-top: 2px;
  }

  /* FILTERS */
  .filters-wrap {
    padding: 1.25rem 4rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    position: sticky;
    top: 0;
    background: rgba(14,14,15,0.95);
    backdrop-filter: blur(12px);
    z-index: 100;
  }
  .filter-label {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.12em;
    color: var(--faint);
    text-transform: uppercase;
    margin-right: 4px;
  }
  .filter-btn {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 4px 12px;
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 400;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.02em;
  }
  .filter-btn:hover { border-color: var(--border2); color: var(--text); }
  .filter-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #0e0e0f;
    font-weight: 500;
  }

  /* MAIN CONTENT */
  main { padding: 2rem 4rem 4rem; }

  .year-section { margin-bottom: 3rem; }
  .year-header {
    display: flex;
    align-items: baseline;
    gap: 1rem;
    margin-bottom: 1.25rem;
    padding-bottom: 0.5rem;
    border-bottom: 1px solid var(--border);
  }
  .year-title {
    font-family: 'DM Serif Display', serif;
    font-size: 1.6rem;
    color: var(--text);
  }
  .year-count {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--faint);
  }

  .cert-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 1px;
    background: var(--border);
  }

  .cert-card {
    background: var(--surface);
    padding: 1rem 1.25rem;
    display: flex;
    flex-direction: column;
    gap: 8px;
    transition: background 0.15s;
    position: relative;
  }
  .cert-card:hover { background: var(--surface2); }
  .cert-card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 2px;
    background: transparent;
    transition: background 0.15s;
  }
  .cert-card:hover::before { background: var(--accent); }

  .cert-title {
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    line-height: 1.4;
  }

  .cert-bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .cert-issuer {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.04em;
  }
  .cert-right {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .cat-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .cert-link {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--accent2);
    text-decoration: none;
    letter-spacing: 0.04em;
    border-bottom: 1px solid transparent;
    transition: border-color 0.15s, color 0.15s;
  }
  .cert-link:hover {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }
  .cert-date {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--faint);
  }

  /* LEGEND */
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    padding: 1.25rem 4rem;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    margin-bottom: 2rem;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--muted);
    cursor: pointer;
  }
  .legend-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
  }

  .hidden { display: none !important; }

  @media (max-width: 768px) {
    header, .stats-row, .filters-wrap, main, .legend { padding-left: 1.25rem; padding-right: 1.25rem; }
    .cert-grid { grid-template-columns: 1fr; }
  }

  /* scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
</style>
</head>

// Build legend
const legend = document.getElementById('legend');
Object.entries(CAT_LABELS).forEach(([cat,label])=>{
  const el = document.createElement('div');
  el.className='legend-item';
  el.dataset.cat=cat;
  el.innerHTML=`<span class="legend-dot" style="background:${CAT_COLORS[cat]}"></span>${label}`;
  el.addEventListener('click',()=>{
    document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
    const btn = document.querySelector(`.filter-btn[data-cat="${cat}"]`);
    if(btn){ btn.classList.add('active'); }
    render(cat);
  });
  legend.appendChild(el);
});

function render(activeCat){
  const filtered = activeCat==='all' ? certs : certs.filter(c=>c.cat===activeCat);
  document.getElementById('stat-total').textContent = filtered.length;
  const byYear = {};
  filtered.forEach(c=>{ const y=c.date.split('-')[0]; if(!byYear[y]) byYear[y]=[]; byYear[y].push(c); });
  const years = Object.keys(byYear).sort((a,b)=>b-a);
  const container = document.getElementById('main');
  container.innerHTML='';
  years.forEach(y=>{
    const sec=document.createElement('div'); sec.className='year-section';
    sec.innerHTML=`<div class="year-header"><span class="year-title">${y}</span><span class="year-count">${byYear[y].length} tanúsítvány</span></div><div class="cert-grid"></div>`;
    const grid=sec.querySelector('.cert-grid');
    byYear[y].forEach(c=>{
      const card=document.createElement('div'); card.className='cert-card';
      const linkHtml = c.url
        ? `<a class="cert-link" href="${c.url}" target="_blank" rel="noopener">Megtekint ↗</a>`
        : `<span class="cert-date">${fmt(c.date)}</span>`;
      card.innerHTML=`
        <div class="cert-title">${c.title}</div>
        <div class="cert-bottom">
          <span class="cert-issuer">${c.issuer}</span>
          <div class="cert-right">
            <span class="cat-dot" style="background:${CAT_COLORS[c.cat]||CAT_COLORS.other}"></span>
            ${linkHtml}
          </div>
        </div>`;
      grid.appendChild(card);
    });
    container.appendChild(sec);
  });
}

document.getElementById('filters').addEventListener('click',e=>{
  if(!e.target.classList.contains('filter-btn')) return;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  e.target.classList.add('active');
  render(e.target.dataset.cat);
});

render('all');
