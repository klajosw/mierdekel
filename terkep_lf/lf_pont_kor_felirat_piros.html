<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Térkép</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        #map {
            height: 100vh;
            width: 100%;
        }
    </style>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
</head>
<body>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>
        // Inicializáljuk a térképet a megadott koordinátákkal
        var map = L.map('map').setView([47, 18], 10);

        // Alaptérkép beállítása
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        // Marker hozzáadása a megadott koordinátákhoz
        var marker = L.marker([47, 18]).addTo(map);
        marker.bindPopup("pont");

        // Kör hozzáadása a megadott koordináták köré 30 km sugarú körrel
        var circle = L.circle([47, 18], {
            color: 'red',
            fillColor: '#f03',
            fillOpacity: 0.5,
            radius: 30000
        }).addTo(map);
        circle.bindPopup("kor");
		

    </script>
</body>
</html>
